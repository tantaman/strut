services:
  slides-rindle:
    build:
      context: .
      args:
        STRUT_APP_BASEPATH: /slides
    image: aamuapp/slides:local
    command:
      - node
      - scripts/start-rindle-docker.mjs
    environment:
      RINDLE_DAEMON_TOKEN: ${RINDLE_DAEMON_TOKEN:?RINDLE_DAEMON_TOKEN is required}
    volumes:
      - slides-rindle-data:/var/lib/slides
    ports:
      - "${SLIDES_RINDLE_WS_PORT:-7601}:7601"
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:7600/schema',{headers:{authorization:'Bearer '+process.env.RINDLE_DAEMON_TOKEN}}).then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s
    networks:
      - aamu-net
    restart: unless-stopped

  slides:
    image: aamuapp/slides:local
    depends_on:
      slides-rindle:
        condition: service_healthy
    environment:
      PORT: 3000
      STRUT_APP_BASEPATH: /slides
      RINDLE_DAEMON_URL: http://slides-rindle:7600
      RINDLE_DAEMON_WS: ${SLIDES_RINDLE_WS_URL:-}
      RINDLE_DAEMON_TOKEN: ${RINDLE_DAEMON_TOKEN:?RINDLE_DAEMON_TOKEN is required}
      STRUT_AUTH_DB: /var/lib/slides-auth/auth.db
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?BETTER_AUTH_SECRET is required}
      BETTER_AUTH_URL: ${SLIDES_PUBLIC_URL:?SLIDES_PUBLIC_URL is required}
      AAMU_INTERNAL_URL: ${AAMU_INTERNAL_URL:-http://host.docker.internal:4001}
      AAMU_SLIDES_SHARED_SECRET: ${AAMU_SLIDES_SHARED_SECRET:?AAMU_SLIDES_SHARED_SECRET is required}
      AAMU_SLIDES_SESSION_SECRET: ${AAMU_SLIDES_SESSION_SECRET:?AAMU_SLIDES_SESSION_SECRET is required}
      AAMU_SLIDES_WEBHOOK_SECRET: ${AAMU_SLIDES_WEBHOOK_SECRET:-}
      S3_ENDPOINT: ${SLIDES_S3_ENDPOINT:-http://minio:9000}
      S3_REGION: ${SLIDES_S3_REGION:-us-east-1}
      S3_BUCKET: ${S3_BUCKET_SLIDES:-aamu-slides-dev}
      S3_ACCESS_KEY_ID: ${SLIDES_S3_ACCESS_KEY_ID:-${MINIO_ROOT_USER}}
      S3_SECRET_ACCESS_KEY: ${SLIDES_S3_SECRET_ACCESS_KEY:-${MINIO_ROOT_PASSWORD}}
      S3_FORCE_PATH_STYLE: ${SLIDES_S3_FORCE_PATH_STYLE:-true}
    volumes:
      - slides-auth-data:/var/lib/slides-auth
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "${SLIDES_HTTP_PORT:-3010}:3000"
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "Promise.all([fetch('http://127.0.0.1:3000/slides/api/rindle/config'),fetch('http://127.0.0.1:3000/slides/api/auth/get-session'),fetch('http://127.0.0.1:3000/slides/api/usage'),fetch(process.env.RINDLE_DAEMON_URL+'/schema',{headers:{authorization:'Bearer '+process.env.RINDLE_DAEMON_TOKEN}})]).then(([config,auth,usage,rindle])=>{if(!config.ok||auth.status>=500||usage.status>=500||!rindle.ok)process.exit(1)}).catch(()=>process.exit(1))"
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s
    networks:
      - aamu-net
    restart: unless-stopped

networks:
  aamu-net:
    external: true
    name: ${AAMU_DOCKER_NETWORK:-docker-dev_aamu-net}

volumes:
  slides-rindle-data:
  slides-auth-data:
