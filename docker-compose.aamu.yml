services:
  slides-rindle:
    build:
      context: .
      args:
        STRUT_APP_BASEPATH: /slides
    image: aamuapp/slides:local
    command:
      - node
      - scripts/start-rindle-docker.mjs
    environment:
      RINDLE_DAEMON_TOKEN: ${RINDLE_DAEMON_TOKEN:?RINDLE_DAEMON_TOKEN is required}
    volumes:
      - slides-rindle-data:/var/lib/slides
    ports:
      - "${SLIDES_RINDLE_WS_PORT:-7601}:7601"
    networks:
      - aamu-net
    restart: unless-stopped

  slides:
    image: aamuapp/slides:local
    depends_on:
      - slides-rindle
    environment:
      PORT: 3000
      STRUT_APP_BASEPATH: /slides
      RINDLE_DAEMON_URL: http://slides-rindle:7600
      RINDLE_DAEMON_WS: ${SLIDES_RINDLE_WS_URL:-ws://localhost:7601}
      RINDLE_DAEMON_TOKEN: ${RINDLE_DAEMON_TOKEN:?RINDLE_DAEMON_TOKEN is required}
      STRUT_AUTH_DB: /var/lib/slides-auth/auth.db
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?BETTER_AUTH_SECRET is required}
      BETTER_AUTH_URL: ${SLIDES_PUBLIC_URL:?SLIDES_PUBLIC_URL is required}
      AAMU_INTERNAL_URL: ${AAMU_INTERNAL_URL:-http://aamuapp:4001}
      AAMU_SLIDES_SHARED_SECRET: ${AAMU_SLIDES_SHARED_SECRET:?AAMU_SLIDES_SHARED_SECRET is required}
      AAMU_SLIDES_SESSION_SECRET: ${AAMU_SLIDES_SESSION_SECRET:?AAMU_SLIDES_SESSION_SECRET is required}
      AAMU_SLIDES_WEBHOOK_SECRET: ${AAMU_SLIDES_WEBHOOK_SECRET:-}
      S3_ENDPOINT: ${MINIO_ENDPOINT:-http://minio:9000}
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_BUCKET: ${S3_BUCKET_SLIDES:-aamu-slides-dev}
      S3_ACCESS_KEY_ID: ${MINIO_ROOT_USER}
      S3_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD}
      S3_FORCE_PATH_STYLE: "true"
    volumes:
      - slides-auth-data:/var/lib/slides-auth
    ports:
      - "${SLIDES_HTTP_PORT:-3000}:3000"
    networks:
      - aamu-net
    restart: unless-stopped

networks:
  aamu-net:
    external: true

volumes:
  slides-rindle-data:
  slides-auth-data:
